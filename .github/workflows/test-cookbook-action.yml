name: Test cookbook action
on:
  push:
    branches: [main, github-action-cookbook]
  pull_request:
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Convert sample recipe
        env:
          RECIPE_GLOB: tests/action-fixtures/*.md
          OUTPUT_DIR: ${{ runner.temp }}/recipe-json
        run: python action/convert.py
      - name: Check generated payload
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recipe-json
        run: python -c 'import json, os; p=json.load(open(os.path.join(os.environ["OUTPUT_DIR"], "soup.json"))); size=p["servingSizes"][0]; out=os.environ["OUTPUT_DIR"]; assert p["title"] == "Tomato soup"; assert size["isDefault"] is True; assert size["ingredientGroups"][0]["isDefault"] is True; assert size["ingredientGroups"][0]["ingredients"][0]["amount"] == "10"; assert len(size["steps"]) == 2; assert size["steps"][0]["mode"]["type"] == "slow_cooking"; assert open(os.path.join(out, "soup.id")).read().strip() == "42"; assert os.path.isfile(open(os.path.join(out, "soup.thumbnail")).read().strip())'
