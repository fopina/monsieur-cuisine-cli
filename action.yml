name: Monsieur Cuisine cookbook
description: Validate cookbook Markdown, publish recipes, fetch recipes, and create recipe-ID pull requests.
inputs:
  operation:
    description: "Action to run: validate Markdown, publish cookbook recipes, or get one recipe."
    required: false
    default: validate
  recipes:
    description: Glob for recipe Markdown files.
    required: false
    default: recipes/**/*.md
  recipe_files:
    description: JSON array of exact, repo-relative Markdown file paths to convert. Overrides recipes.
    required: false
  output:
    description: Directory where JSON payloads are written.
    required: false
    default: build/recipes
  recipe:
    description: Optional recipe ID or full Monsieur Cuisine recipe URL to fetch instead of converting Markdown files.
    required: false
  session_token:
    description: CLI API access token from session.json, required for get and publish operations.
    required: false
  github_token:
    description: GitHub token with contents:write and pull-requests:write permissions, required for publishing.
    required: false
  secrets_write_token:
    description: Optional token with Actions secrets write permission to persist a refreshed MC_API_ACCESS_TOKEN.
    required: false
outputs:
  output-directory:
    description: Directory containing the generated or fetched recipe JSON.
    value: ${{ steps.convert.outputs.output-directory || steps.get_recipe.outputs.output-directory }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Validate operation
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
      run: |
        case "$OPERATION" in
          validate|publish|get) ;;
          *) echo "operation must be validate, publish, or get" >&2; exit 1 ;;
        esac
    - name: Install image processing dependency
      if: ${{ inputs.operation == 'validate' || inputs.operation == 'publish' }}
      shell: bash
      run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
    - id: convert
      if: ${{ inputs.operation == 'validate' || inputs.operation == 'publish' }}
      shell: bash
      env:
        RECIPE_GLOB: ${{ inputs.recipes }}
        RECIPE_FILES_JSON: ${{ inputs.recipe_files }}
        OUTPUT_DIR: ${{ inputs.output }}
      run: python "${{ github.action_path }}/action/convert.py"
    - name: Install CLI for recipe operations
      if: ${{ inputs.operation == 'get' || inputs.operation == 'publish' }}
      shell: bash
      run: python -m pip install --disable-pip-version-check "${{ github.action_path }}"
    - id: get_recipe
      if: ${{ inputs.operation == 'get' }}
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        SESSION_TOKEN: ${{ inputs.session_token }}
        OUTPUT_DIR: ${{ inputs.output }}
      run: python "${{ github.action_path }}/action/get_recipe.py"
    - name: Publish recipes and open recipe ID pull request
      if: ${{ inputs.operation == 'publish' }}
      shell: bash
      env:
        RECIPE_JSON_DIR: ${{ steps.convert.outputs.output-directory }}
        SESSION_TOKEN: ${{ inputs.session_token }}
        GH_TOKEN: ${{ inputs.github_token }}
        GH_SECRETS_WRITE_TOKEN: ${{ inputs.secrets_write_token }}
      run: python "${{ github.action_path }}/action/publish_recipes.py"
